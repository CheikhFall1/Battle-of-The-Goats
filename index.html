<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Battle of The GOATs</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <div class="start-screen">
    <div class="start-overlay">
      <h1 class="start-title">Battle of The GOATs</h1>
      <p class="start-subtitle">Choose your legend. Build your legacy.</p>
      <button class="start-button">Start Match</button>
    </div>
  </div>

  <main class="game">
    <section class="card">
      <p class="tag">Interactive Story Game</p>
      <p id="sceneLabel" class="scene-label">Character Select</p>
      <h1 class="title">Battle of The GOATs</h1>

      <img id="sceneImage" src="mr.webp" alt="Battle of The GOATs scene" />

      <p id="storyText">
        The stadium is packed. The lights are bright. Two legends are ready for the final moment.
        Who are you choosing?
      </p>

      <div id="choices" class="choices"></div>

      <audio id="celebrationSound">
        <source src="Celebration Sound Effect.mp3" type="audio/mpeg" />
      </audio>

      <audio id="crowdSound">
        <source src="crowd.mp3" type="audio/mpeg" />
      </audio>

      <audio id="clickSound">
        <source src="click.mp3" type="audio/mpeg" />
      </audio>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
